<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e22"/>
      <stop offset="50%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1b3a7a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Academic Graduation Cap (Mortarboard) -->
  <g filter="url(#glow)">
    <!-- Top Diamond of Cap -->
    <polygon points="32,13 54,23 32,33 10,23" fill="url(#goldGrad)"/>
    
    <!-- Cap Skull Skull Base -->
    <path d="M19,27.5 L19,36.5 C19,42.5 45,42.5 45,36.5 L45,27.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Tassel hanging from button -->
    <path d="M47,26.5 L50,33 L50,39" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="40.5" r="1.8" fill="#fde047"/>
    <circle cx="32" cy="23" r="2" fill="#fef08a"/>

    <!-- Open Book Pages (Centerfold) underneath -->
    <path d="M15,44 C22,41 29,43 32,46.5 C35,43 42,41 49,44 L49,51.5 C42,48.5 35,50.5 32,54 C29,50.5 22,48.5 15,51.5 Z" fill="url(#bookGrad)"/>
    <path d="M32,46.5 L32,54" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small Academic Sparkle in Corner -->
  <path d="M13,11 Q14.5,14 16,14.5 Q14.5,15 13,18 Q11.5,15 10,14.5 Q11.5,14 13,11 Z" fill="#fde047"/>
</svg>